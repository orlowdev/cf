# build-binaries — compile cf for the supported platforms and attach them to a release.
#
# Runs on `workflow_call` (from release.yml, with the version to stamp) and on a hand-pushed ring tag.
# Each platform builds from its OWN committed seed (boot/seed_mac / boot/seed_linux), so there is no
# cross-emit and no foreign toolchain — only the system `cc` and the vendored qbe:
#   darwin-arm64   → macOS runner, native `build.sh`
#   darwin-amd64   → Intel macOS runner (macos-13), native `build.sh darwin-amd64` (shares the mac seed
#                    IL with arm64 — the amd64 `syscall` class bit lives in the floor, not the IL)
#   linux-arm64    → ubuntu-arm runner, native `build.sh linux-arm64`
#   linux-riscv64  → ubuntu-arm runner, `build.sh linux-riscv64` cross-linked with the distro's
#                    gcc-riscv64-linux-gnu (shared linux IL, riscv floor)
# Every binary is stamped with the release version via lib/std/compiler/buildinfo.cf, so it reports
# itself through `std::comptime::version::compiler`.
#
# STATUS: darwin-arm64/darwin-amd64/linux-arm64/linux-riscv64 validated. darwin byte-reproduces the
# seed (arm64 natively; amd64 under Rosetta 2 — arm64/amd64 emit identical IL). Both linux targets static
# musl (the floor calls musl's `__init_libc`): linux-arm64 built + ran natively on a real aarch64 Linux
# VM; linux-riscv64 cross-built (musl cross toolchain) + ran under qemu-riscv64 — cf compiles+runs
# programs and its embedded QBE works under the custom `_start` on both. The riscv leg downloads its
# musl cross toolchain from the cross-tools/musl-cross GitHub release (a reliable GitHub-hosted mirror;
# the old musl.cc host chronically timed out from the runners), pinned by tag + verified by sha256.
name: build-binaries

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  push:
    tags:
      - '*-nightly'
      - '*-rc'
      - '*-latest'
      - '*-stable'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-14
            target: darwin-arm64
            experimental: false
          - name: darwin-amd64
            runner: macos-13   # macos-13 is the last Intel x86-64 image; macos-14+ are arm64
            target: darwin-amd64
            experimental: false
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
            experimental: false
          - name: linux-riscv64
            runner: ubuntu-24.04-arm
            target: linux-riscv64
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Stamp the compiler version
        run: |
          v='${{ steps.v.outputs.version }}'
          sed -i.bak "s/\"0.0.0-dev\"/\"$v\"/" lib/std/compiler/buildinfo.cf
          rm -f lib/std/compiler/buildinfo.cf.bak
          # Fail loudly if the sed no-op'd (the `0.0.0-dev` sentinel drifted): shipping a binary that
          # reports the wrong version is worse than a red build. `--version` reads this const.
          grep -q "compiler_version = \"$v\"" lib/std/compiler/buildinfo.cf \
            || { echo "stamp failed: buildinfo.cf still has no \"$v\"" >&2; exit 1; }
          grep compiler_version lib/std/compiler/buildinfo.cf

      - name: Install linux build tools (musl + libgcc)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential musl-tools

      # Cache the extracted toolchain (a static, versioned tarball) so we fetch
      # the release asset at most once. Kept under $HOME so actions/cache can
      # read/restore it as the non-root runner user (no sudo, no /opt).
      - name: Cache the riscv64 musl cross toolchain
        id: riscv-toolchain
        if: matrix.target == 'linux-riscv64'
        uses: actions/cache@v4
        with:
          path: ~/riscv64-unknown-linux-musl
          key: riscv64-unknown-linux-musl-cross-20260823

      - name: Download the riscv64 musl cross toolchain
        if: matrix.target == 'linux-riscv64' && steps.riscv-toolchain.outputs.cache-hit != 'true'
        run: |
          # Pinned cross-tools/musl-cross release — a reliable GitHub-hosted
          # mirror (the old musl.cc host chronically timed out from the runners).
          # Download to a file (never pipe a possibly-truncated stream into tar),
          # retry, then verify against the release's published sha256.
          tag=20260823
          txz=riscv64-unknown-linux-musl.tar.xz
          base=https://github.com/cross-tools/musl-cross/releases/download/$tag
          sha=aa6630f73487e5d3eb6ffa861199c3d63dfe0db8af77452581628cd762c9a64d
          curl -fL --connect-timeout 30 --retry 5 --retry-delay 10 \
               --retry-all-errors -o "$txz" "$base/$txz"
          echo "$sha  $txz" | sha256sum -c -
          tar xJf "$txz" -C "$HOME"
          rm -f "$txz"

      - name: Add the riscv64 toolchain to PATH
        if: matrix.target == 'linux-riscv64'
        run: |
          echo "$HOME/riscv64-unknown-linux-musl/bin" >> "$GITHUB_PATH"
          echo "RISCV_CC=riscv64-unknown-linux-musl-gcc" >> "$GITHUB_ENV"
          echo "RISCV_STRIP=riscv64-unknown-linux-musl-strip" >> "$GITHUB_ENV"

      - name: Build
        env:
          CF_STRIP: 1   # release binaries are stripped (objects already carry no -g)
        run: ./boot/build.sh "${{ matrix.target }}"

      # Prove the artifact actually carries the tag: `cf --version` reads the stamped
      # compiler_version. Only native targets run here (riscv is cross-built and can't
      # execute on the arm runner — its stamp is guarded at the source level above).
      - name: Verify the binary reports the release version
        if: matrix.target != 'linux-riscv64'
        run: |
          got="$(./var/cf --version)"
          want='${{ steps.v.outputs.version }}'
          echo "cf --version -> $got (want $want)"
          [ "$got" = "$want" ] || { echo "version mismatch" >&2; exit 1; }

      - name: Package
        id: pkg
        run: |
          bin="cf-${{ steps.v.outputs.version }}-${{ matrix.name }}"
          cp var/cf "$bin"
          if command -v sha256sum >/dev/null; then sha256sum "$bin" > "$bin.sha256"; else shasum -a 256 "$bin" > "$bin.sha256"; fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.v.outputs.version }}" "${{ steps.pkg.outputs.bin }}" "${{ steps.pkg.outputs.bin }}.sha256" --clobber
