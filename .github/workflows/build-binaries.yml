# build-binaries — compile cf for the supported platforms and attach them to a release.
#
# Runs on `workflow_call` (from release.yml, with the version to stamp) and on a hand-pushed ring tag.
# Each platform builds from its OWN committed seed (boot/seed_mac / boot/seed_linux), so there is no
# cross-emit and no foreign toolchain — only the system `cc` and the vendored qbe:
#   darwin-arm64   → macOS runner, native `build.sh`
#   linux-arm64    → ubuntu-arm runner, native `build.sh linux-arm64`
#   linux-riscv64  → ubuntu-arm runner, `build.sh linux-riscv64` cross-linked with the distro's
#                    gcc-riscv64-linux-gnu (shared linux IL, riscv floor)
# Every binary is stamped with the release version via lib/std/compiler/buildinfo.cf, so it reports
# itself through `std::comptime::version::compiler`.
#
# STATUS: darwin-arm64 is validated (the same build.sh used locally, byte-reproducing the seed). The
# linux legs are UNVALIDATED IN CI — the freestanding-`_start` + static-libc link (cf's floor owns
# `_start`; embedded QBE needs libc) works on darwin but has not yet been exercised on linux — so they
# carry `continue-on-error` and never block a release until a first run confirms them.
name: build-binaries

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  push:
    tags:
      - '*-nightly'
      - '*-rc'
      - '*-latest'
      - '*-stable'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-14
            target: darwin-arm64
            experimental: false
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
            experimental: true
          - name: linux-riscv64
            runner: ubuntu-24.04-arm
            target: linux-riscv64
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Stamp the compiler version
        run: |
          sed -i.bak 's/"0.0.0-dev"/"${{ steps.v.outputs.version }}"/' lib/std/compiler/buildinfo.cf
          rm -f lib/std/compiler/buildinfo.cf.bak
          grep compiler_version lib/std/compiler/buildinfo.cf

      - name: Install linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install the riscv64 cross toolchain
        if: matrix.target == 'linux-riscv64'
        run: sudo apt-get install -y gcc-riscv64-linux-gnu

      - name: Build
        run: ./boot/build.sh "${{ matrix.target }}"

      - name: Package
        id: pkg
        run: |
          bin="cf-${{ steps.v.outputs.version }}-${{ matrix.name }}"
          cp var/cf "$bin"
          if command -v sha256sum >/dev/null; then sha256sum "$bin" > "$bin.sha256"; else shasum -a 256 "$bin" > "$bin.sha256"; fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.v.outputs.version }}" "${{ steps.pkg.outputs.bin }}" "${{ steps.pkg.outputs.bin }}.sha256" --clobber
