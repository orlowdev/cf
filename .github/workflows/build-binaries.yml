# build-binaries — compile cf for the supported host platforms and attach them to a release.
#
# Runs on `workflow_call` (from release.yml, with the version to stamp) and on a hand-pushed ring tag.
# Every leg runs on ONE macOS-arm64 runner: darwin-arm64 is a native `build.sh`; the linux targets are
# cross-compiled with `zig cc` (which bundles a musl sysroot, so QBE's C runtime links static without a
# host toolchain). Each binary is stamped with the release version via `lib/std/compiler/buildinfo.cf`,
# so it reports itself through `std::comptime::version::compiler`.
#
# STATUS: darwin-arm64 is validated (the same `build.sh` used locally). The linux/riscv64 legs are
# EXPERIMENTAL — cross-linking the compiler's embedded QBE (a libc-using C runtime) has not been run in
# CI yet, so they carry `continue-on-error` and never block a release. See boot/build-cross.sh.
name: build-binaries

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  push:
    tags:
      - '*-nightly'
      - '*-rc'
      - '*-latest'
      - '*-stable'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            method: native
            experimental: false
          - name: linux-arm64
            method: cross
            arch: arm64
            experimental: true
          - name: linux-riscv64
            method: cross
            arch: riscv64
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Stamp the compiler version
        run: |
          sed -i.bak 's/"0.0.0-dev"/"${{ steps.v.outputs.version }}"/' lib/std/compiler/buildinfo.cf
          rm -f lib/std/compiler/buildinfo.cf.bak
          grep compiler_version lib/std/compiler/buildinfo.cf

      - name: Install zig (cross legs only)
        if: matrix.method == 'cross'
        run: brew install zig

      - name: Build (native)
        if: matrix.method == 'native'
        run: |
          ./boot/build.sh
          cp var/cf "cf-${{ steps.v.outputs.version }}-${{ matrix.name }}"

      - name: Build (cross)
        if: matrix.method == 'cross'
        run: |
          ./boot/build-cross.sh "${{ matrix.arch }}"
          cp "var/cf-linux-${{ matrix.arch }}" "cf-${{ steps.v.outputs.version }}-${{ matrix.name }}"

      - name: Checksum
        run: shasum -a 256 "cf-${{ steps.v.outputs.version }}-${{ matrix.name }}" > "cf-${{ steps.v.outputs.version }}-${{ matrix.name }}.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.v.outputs.version }}" \
            "cf-${{ steps.v.outputs.version }}-${{ matrix.name }}" \
            "cf-${{ steps.v.outputs.version }}-${{ matrix.name }}.sha256" \
            --clobber
