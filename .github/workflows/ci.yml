# ci — pull-request gate for changes targeting margarita.
#
# One check runs on every PR into margarita:
#   format  — build cf, then assert every `.cf` under boot/src + lib is already formatted
#             (`cf format --check`). A drifted file fails the PR. Scope is the hand-written
#             source only: boot/seed_* are emitted IL/asm, boot/vendor is C, and the
#             boot/tests/corpus fixtures are deliberately varied.
#
# The corpus suite is NOT a PR gate — it's the RELEASE gate for the rc/latest/stable rings
# (see release.yml), where it runs per-arch before a release is cut. On a margarita PR,
# formatting is the whole gate for now.
#
# Runs on macos-14 (arm64): it matches the committed darwin seed and ships `cc`, so no
# toolchain install is needed (same runner as release.yml's version job).
name: ci

on:
  pull_request:
    branches: [margarita]

permissions:
  contents: read

jobs:
  format:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build cf
        run: ./boot/build.sh
      - name: Check boot/src + lib are formatted
        run: |
          unformatted=""
          for f in $(find boot/src lib -name '*.cf'); do
            ./var/cf format --check "$f" >/dev/null 2>&1 || unformatted="$unformatted $f"
          done
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted cf source (run \`cf format <file>\`):"
            for f in $unformatted; do echo "  $f"; done
            exit 1
          fi
          echo "all boot/src + lib .cf files are formatted"
