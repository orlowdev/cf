# release — cut a GenVer release when a ring branch advances.
#
# On a push to a release-ring branch, compute the ring's next version from the commits since its last
# tag (`versioning tag`), and — if that version has no release yet — create the tag and a GitHub
# Release whose notes are the grouped changelog (`versioning changelog`). Idempotent: a push that added
# no glory/enhancement/nurture commits yields the existing version, so nothing is created. Creating the
# release then fans out to the binary build via `workflow_call` (a tag created with GITHUB_TOKEN does
# NOT itself trigger `on: push: tags`, so the fan-out is explicit, not tag-driven).
name: release

on:
  push:
    branches: [behemoth, azazello, koroviev, master]

permissions:
  contents: write

jobs:
  # Corpus gate — the rc/latest/stable rings only. Build cf on each natively-runnable arch and run the
  # whole corpus (boot/test.sh: compile -> embedded QBE -> link -> run, exit vs `# expect:`) BEFORE any
  # release is cut. A failure fails the workflow and the `version` job below never creates a release, so
  # a broken build is never published. Nightly (behemoth) SKIPS this so nightly cuts stay fast — the
  # corpus never gated nightly. darwin-amd64 (Rosetta-only) and linux-riscv64 (needs qemu) aren't run
  # here, but the gate covers their IL transitively — darwin-amd64 shares the mac IL exercised by
  # darwin-arm64, riscv the linux IL exercised by linux-arm64 — leaving only their floor asm unrun.
  corpus:
    if: github.ref_name != 'behemoth'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: darwin-arm64
            runner: macos-14
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
          - arch: linux-amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Linux: musl-gcc builds cf; clang + ld.lld are what cf itself uses to link the corpus programs it
      # compiles (freestanding `-static -e _start` ELF, no libc). darwin needs neither — `cc` covers both.
      - name: Install linux toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential musl-tools clang lld
      - name: Build cf and run the corpus (${{ matrix.arch }})
        run: ./boot/test.sh

  version:
    needs: corpus
    # Run when the gate PASSED (rc/latest/stable) or was SKIPPED (nightly) — but not when it FAILED or
    # was cancelled. `!cancelled()` lifts the implicit "all needs succeeded" so a skipped gate still
    # lets nightly through; `result != 'failure'` is what actually blocks a release on a red corpus.
    if: ${{ !cancelled() && needs.corpus.result != 'failure' }}
    runs-on: macos-14
    outputs:
      version: ${{ steps.compute.outputs.version }}
      created: ${{ steps.compute.outputs.created }}
      ring: ${{ steps.ring.outputs.ring }}
      prerelease: ${{ steps.ring.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags: `versioning` reads `git describe` and the commit log

      - name: Map ring branch to pre-release label
        id: ring
        run: |
          # `prerelease` marks the GitHub Release: the pre-release rings (nightly/rc) are flagged so
          # GitHub does not surface them as "Latest"; koroviev/master are full releases.
          case "${{ github.ref_name }}" in
            behemoth) echo "ring=nightly" >> "$GITHUB_OUTPUT"; echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            azazello) echo "ring=rc"      >> "$GITHUB_OUTPUT"; echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            koroviev) echo "ring=latest"  >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            master)   echo "ring=stable"  >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "release: unmapped branch ${{ github.ref_name }}" >&2; exit 1 ;;
          esac

      - name: Build cf and the versioning tool
        run: |
          ./boot/build.sh
          ./var/cf c lib/versioning/versioning.cf -o var/versioning

      - name: Compute next version, create the release if it is new
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ring="${{ steps.ring.outputs.ring }}"
          version="$(./var/versioning tag "$ring")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next version on $ring: $version"

          if gh release view "$version" >/dev/null 2>&1; then
            echo "release $version already exists — nothing to cut"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            ./var/versioning changelog "$ring" > release-notes.md

            # The tool credits commits by short sha `- <title> (<sha>)`; git carries no GitHub handle.
            # Resolve each bullet's sha to its author `@login` via the API and append it, so GitHub
            # linkifies the mention (and builds its own Contributors list). A commit with no linked
            # GitHub account falls back to the plain author name (no `@`). One API call per commit.
            resolve_authors() {
              while IFS= read -r line; do
                case "$line" in
                  "- "*"("*")")
                    sha="$(printf '%s' "$line" | sed -n 's/.*(\([0-9a-f]\{7,40\}\))$/\1/p')"
                    if [ -n "$sha" ]; then
                      who="$(gh api "repos/{owner}/{repo}/commits/$sha" \
                              --jq 'if .author.login then "@" + .author.login else .commit.author.name end' \
                              2>/dev/null || true)"
                      [ -n "$who" ] && line="$line - $who"
                    fi
                    ;;
                esac
                printf '%s\n' "$line"
              done
            }
            resolve_authors < release-notes.md > release-notes.resolved.md
            mv release-notes.resolved.md release-notes.md

            prerelease=""
            if [ "${{ steps.ring.outputs.prerelease }}" = "true" ]; then prerelease="--prerelease"; fi
            # shellcheck disable=SC2086
            gh release create "$version" \
              --title "$version" \
              --notes-file release-notes.md \
              --target "${{ github.sha }}" \
              $prerelease
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    needs: version
    # `!cancelled()` is load-bearing: `version` runs past a SKIPPED `corpus` (nightly) via its own
    # status-function `if`, but without a status function here GitHub would propagate that skip down the
    # `needs` chain and skip `binaries` regardless of `created` — so a nightly release got no binaries.
    # With it, the skip no longer propagates and the real gate (`version` succeeded, a release was cut)
    # decides. `created` is empty when `version` itself was skipped (rc/latest/stable with a red corpus).
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.created == 'true' }}
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}

  # Rolling per-ring release: a release tagged with the bare ring name (nightly/rc/latest/stable) that
  # is re-pointed to this commit and carries the just-built binaries under version-independent names
  # `cf-<ring>-<platform>`. This is what makes a STABLE download URL possible — GitHub embeds the
  # release TAG in the download path, so "latest on a ring" needs a fixed tag, not just a fixed asset
  # name. The versioned releases stay the canonical, immutable ones; these rolling releases are marked
  # not-latest (and inherit the ring's prerelease flag) so they never displace them as "Latest".
  #   https://github.com/<owner>/cf/releases/download/<ring>/cf-<ring>-<platform>
  # The bare `<ring>` tags don't collide with the `<version>-<ring>` tags `versioning` matches on.
  promote:
    needs: [version, binaries]
    # Same status-function requirement as `binaries`: only mirror the rolling ring release when the
    # binaries actually built (`binaries` succeeded — which already implies a release was cut).
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Refresh the rolling `${{ needs.version.outputs.ring }}` release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RING: ${{ needs.version.outputs.ring }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          mkdir dist
          # Mirror the just-built versioned binaries under ring-based names, with fresh checksums.
          # Everything the rolling release should carry lands in dist/; notes.md stays OUT of it so the
          # `dist/*` upload glob picks up only the binaries and their checksums, never the notes.
          for name in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64 linux-riscv64; do
            if gh release download "$VERSION" -R "$REPO" -p "cf-$VERSION-$name" -D dist 2>/dev/null; then
              mv "dist/cf-$VERSION-$name" "dist/cf-$RING-$name"
              ( cd dist && sha256sum "cf-$RING-$name" > "cf-$RING-$name.sha256" )
            else
              echo "note: no cf-$VERSION-$name asset — skipping"
            fi
          done
          cat > notes.md <<EOF
          Rolling **$RING** channel — always serves the latest \`$RING\` build (currently $VERSION).

          Stable per-platform download URL (never changes as the ring advances):
          \`https://github.com/$REPO/releases/download/$RING/cf-$RING-<platform>\`
          where \`<platform>\` ∈ { darwin-arm64, darwin-amd64, linux-arm64, linux-amd64, linux-riscv64 }.
          Each binary has a \`.sha256\` sibling. For an immutable pin, use the versioned release $VERSION.
          EOF
          # Move the rolling tag to this commit (delete + recreate) and attach the mirrored assets.
          gh release delete "$RING" -R "$REPO" --cleanup-tag --yes 2>/dev/null || true
          pre=""; [ "$PRERELEASE" = "true" ] && pre="--prerelease"
          # shellcheck disable=SC2086
          gh release create "$RING" -R "$REPO" \
            --target "$SHA" \
            --title "cf $RING (rolling)" \
            --latest=false \
            $pre \
            --notes-file notes.md \
            dist/*
