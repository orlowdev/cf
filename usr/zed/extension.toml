id = "cflang"
name = "C! (cflang)"
version = "0.0.1"
schema_version = 1
authors = ["The C! authors"]
description = "Syntax highlighting and editor support for the C! (cflang) language."
repository = "https://github.com/orlowdev/cflang"

# The grammar is bundled in-repo (translated from root/specs/ebnf.md). Zed clones
# `repository` into <extension>/grammars/cflang and builds the grammar found at
# `path` inside that clone. For local dev `repository` is a `file://` URL of this
# repo (no GitHub push needed) and `rev` pins a commit containing the grammar
# source (kept at usr/zed/tree-sitter-cflang, *outside* Zed's clone target). Bump
# `rev` after committing grammar changes so Zed rebuilds them.
[grammars.cflang]
repository = "file:///Users/orlowdev/Code/cflang"
rev = "e4a3fc6e8554bec84d26f30ab55052c15728e29c"
path = "usr/zed/tree-sitter-cflang"

# LSP: deferred. C! has no language server yet. When one exists, register it here
# as `[language_servers.cflang]` with its binary/args, and Zed will spawn it for
# `.cf` files. Nothing else in this extension needs to change.
