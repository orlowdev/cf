id = "cflang"
name = "C! (cflang)"
version = "0.0.2"
schema_version = 1
authors = ["The C! authors"]
description = "Syntax highlighting and editor support for the C! (cflang) language."
repository = "https://github.com/orlowdev/zed-cflang"

# The grammar lives in its own repo (github.com/orlowdev/tree-sitter-cflang), vendored
# into the cf tree via `git subtree` at usr/tree-sitter-cflang for in-tree development.
# Zed clones `repository` at `rev` and builds the grammar at its root (no `path`, since the
# grammar IS the repo root). Bump `rev` to a new tree-sitter-cflang commit after pushing
# grammar changes upstream (git subtree push) so Zed rebuilds them.
[grammars.cflang]
repository = "https://github.com/orlowdev/tree-sitter-cflang"
rev = "c78a49a36d052bba7176a2506778e90b6bb69ab0"

# The C! language server: the compiler itself, `cf lsp` (a stdio LSP; diagnostics on
# open/save, positions in utf-8 byte columns). The wasm shim (src/lib.rs) resolves the
# `cf` binary on the worktree's PATH — override with Zed settings:
#   "lsp": { "cf-lsp": { "binary": { "path": "/path/to/cf" } } }
[language_servers.cf-lsp]
name = "cf lsp"
languages = ["C!"]
