name = "C!"
grammar = "cflang"
path_suffixes = ["cf"]
language_servers = ["cf-lsp"]

# Comments run `#` to end of line; no block comments.
line_comments = ["# "]

# Hard tabs, 2 columns wide (root/code_style/indentation.md).
tab_size = 2
hard_tabs = true

autoclose_before = ",=}])> \t"

# `$buf` stack bindings and `push!` allocation-marked names are ONE identifier —
# double-click and word motions should take the marker with the name.
word_characters = ["$", "!"]

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
